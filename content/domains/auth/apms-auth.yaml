claims:
  - id: claim-auth-jwt-stateless
    statement: "Access Token(유효시간 1시간)은 서명 검증만으로 무상태(Stateless) 인증을 수행하며, Authorization Bearer 헤더로 전달된다."
    type: SECURITY
    evidence_refs:
      - ev-auth-jwt-filter
    metrics:
      token_ttl_seconds: 3600
      algorithm: "HMAC-SHA256"

  - id: claim-auth-rtr
    statement: "Refresh Token(유효시간 7일)은 HttpOnly Secure Cookie로 전달되며, 토큰 갱신 시 원자적 Lua Script를 통해 기존 JTI를 즉시 폐기하고 신규 JTI로 교체(RTR)하여 재사용 공격을 방어한다."
    type: SECURITY
    evidence_refs:
      - ev-auth-rtr
    metrics:
      refresh_ttl_days: 7
      rtr_atomic_mechanism: "Redis Single-Threaded Lua Script (1-RTT)"

  - id: claim-auth-blacklist
    statement: "로그아웃 요청 시 Access Token의 잔여 TTL 동안 Redis Blacklist에 등록하여 해당 토큰의 즉시 접근을 원천 차단한다."
    type: SECURITY
    evidence_refs:
      - ev-auth-blacklist

  - id: claim-auth-redis-resilience
    statement: "Redis 일시 장애 시 Lettuce 커맨드 타임아웃을 2초로 제한하고 503 Service Unavailable로 격리하여 WAS 스레드 풀 고갈을 방어한다."
    type: RESILIENCY
    evidence_refs:
      - ev-ts-redis-timeout
    metrics:
      timeout_seconds: 2
      fallback_http_status: 503

decisions:
  - decision: "순수 DB 세션 대신 Stateless JWT + Redis In-Memory Blacklist 하이브리드 채택"
    why: "모든 API 요청마다 DB I/O가 발생하는 Stateful 세션의 병목을 방지하고, 무상태 JWT의 한계인 '즉시 세션 무효화 불가' 문제를 Redis 잔여 TTL 블랙리스트로 보완하여 확장성과 보안을 동시에 확보."
    alternatives_rejected:
      - option: "전통적 RDBMS 세션 테이블"
        rejection_reason: "동시 접속 증가 시 DB 커넥션 풀 고갈 및 I/O 병목 발생 (k6 부하 테스트 목표 달성 불가)."
      - option: "블랙리스트 없는 순수 무상태 JWT"
        rejection_reason: "로그아웃 후에도 토큰 만료 시까지 접근이 유효하여 엔터프라이즈 보안 감사 요건 미충족."

  - decision: "Refresh Token Rotation(RTR) 구현 시 Redis Lua Script 적용"
    why: "토큰 조회, 현재 JTI 일치 검증, 신규 JTI 저장을 단 1회의 네트워크 RTT로 원자적(Atomic) 처리하여 동시성 레이스 컨디션 및 Replay Attack 방지."
    alternatives_rejected:
      - option: "Spring Data Redis 다중 커맨드 (get -> validate -> set)"
        rejection_reason: "클라이언트에서 동시 다발 갱신 요청 시 중간 검증 틈새로 인한 토큰 중복 발급 위험 발생."

tradeoffs:
  - aspect: "Redis 저장소 의존성 추가"
    benefit: "서브 밀리초(Sub-millisecond) 초고속 토큰 검증 및 즉시 로그아웃 제어 가능."
    cost: "Redis 인프라 장애 시 인증 서비스 영향도 증가."
    mitigation: "Lettuce 커맨드 타임아웃 2초 단축, DataAccessException 전역 캐치 및 503 에러 핸들링 구축 (TS-01)."

  - aspect: "Access Token 유효기간 1시간 설정"
    benefit: "Refresh 요청 빈도를 줄여 네트워크 오버헤드 감소."
    cost: "탈취 시 유효시간 동안 위험 노출."
    mitigation: "로그아웃 시 블랙리스트 즉시 등록 및 Refresh Token HttpOnly Cookie 격리."

limitations:
  - limitation: "Redis Cluster 다중 노드 레플리케이션 미구현"
    status: PLANNED
    roadmap: "단일 Redis 노드 장애 대비 Sentinel 또는 Cluster 아키텍처 도입 계획."

  - limitation: "OWASP ZAP 자동화 침투 모의해킹 검증"
    status: PLANNED
    roadmap: "CI/CD 파이프라인 연계 취약점 스캔 도입 계획."

sections:
  - id: sec-auth-problem
    title: "Problem: 무상태(Stateless) 인증의 보안 딜레마"
    role: problem
    target_templates: ["LONGFORM", "FEATURE", "SLIDE"]
    summary: "무상태 JWT는 확장성이 뛰어나지만, 즉시 세션 무효화가 불가능하고 Refresh Token 탈취 시 Replay Attack에 취약합니다."
    content_markdown: |
      전통적인 Stateful 세션은 서버 메모리나 DB에 세션을 저장하므로 즉시 로그아웃 제어가 가능하지만, 대용량 트래픽 환경에서 I/O 병목을 유발합니다.
      반면 Stateless JWT는 서명 검증만으로 인가가 가능하여 확장성이 높지만, **'발급된 토큰의 즉시 회수 불가(Token Revocation Gap)'**라는 태생적 보안 취약점이 존재합니다.
      APMS.SR은 이 딜레마를 해결하기 위해 하이브리드 토큰 수명 주기 관리 아키텍처를 설계했습니다.

  - id: sec-auth-decision
    title: "Decision: 3중 보안 방어선 및 Lua Script RTR"
    role: decision
    target_templates: ["LONGFORM", "FEATURE", "TECHNICAL", "SLIDE"]
    summary: "Stateless 서명 검증과 In-Memory Redis TTL 블랙리스트, 원자적 Lua Script RTR을 결합한 3중 방어 체계를 구축했습니다."
    content_markdown: |
      1. **1차 방어선 (Access Token):** 1시간 수명의 Stateless JWT. 서명 및 `type: access` 검증으로 대부분의 정상 요청을 DB 접근 없이 고속 처리.
      2. **2차 방어선 (Token Blacklist):** 로그아웃 시 Access Token의 남은 유효시간 동안 Redis Blacklist에 JTI를 적재하여 즉시 차단.
      3. **3차 방어선 (RTR):** Refresh Token 재발급 시 기존 UUID JTI를 폐기하고 신규 JTI를 1-RTT Lua Script로 교체하여 토큰 탈취 재사용 방어.

  - id: sec-auth-architecture
    title: "Architecture & Token Lifecycle Flow"
    role: architecture
    target_templates: ["LONGFORM", "FEATURE", "TECHNICAL", "SLIDE"]
    summary: "클라이언트와 Nginx, Spring Boot, Redis 간의 인증 및 토큰 재발급 시퀀스 흐름도입니다."
    diagram:
      type: "mermaid"
      code: |
        sequenceDiagram
            autonumber
            actor Client
            participant Nginx as Nginx (Port 80)
            participant Backend as Spring Boot API
            participant Redis as Redis 7 (In-Memory)

            Note over Client,Backend: 1. 로그인 요청 및 토큰 발급
            Client->>Nginx: POST /api/auth/login
            Nginx->>Backend: Proxy Pass
            Backend->>Redis: SET auth:refresh:user:{id} = <jti> (TTL 7d)
            Backend-->>Client: Access Token (Header) + Refresh Token (HttpOnly Cookie)

            Note over Client,Backend: 2. 일반 API 요청
            Client->>Nginx: GET /api/users/me (Bearer Token)
            Nginx->>Backend: Proxy Pass
            Backend->>Backend: 1) JWT 서명 및 Token Type 검증
            Backend->>Redis: 2) Blacklist 확인 (EXISTS blacklist:{jti})
            Backend-->>Client: 200 OK (ApiResponse)

            Note over Client,Backend: 3. 로그아웃 (즉시 무효화)
            Client->>Nginx: POST /api/auth/logout
            Backend->>Redis: SET blacklist:{jti} = "logout" (TTL: 잔여 유효시간)
            Backend->>Redis: DEL auth:refresh:user:{id}
            Backend-->>Client: 200 OK (쿠키 만료)

  - id: sec-auth-implementation-rtr
    title: "Implementation: Atomic Lua Script Token Rotation"
    role: implementation
    target_templates: ["FEATURE", "TECHNICAL"]
    summary: "RefreshTokenRepository의 Lua Script를 통해 동시성 경쟁 없이 원자적으로 JTI를 갱신합니다."
    content_markdown: |
      Spring Data Redis의 `execute(RedisScript, ...)`를 사용하여 Redis 엔진 레벨에서 원자적 실행을 보장합니다.
    code_snippets:
      - source_file: "backend/src/main/java/com/example/demo/auth/security/RefreshTokenRepository.java"
        language: "java"
        line_range: "L45-L65"
        code: |
          private static final String ROTATE_SCRIPT =
              "local current = redis.call('GET', KEYS[1]) " +
              "if not current then return -1 end " +
              "if current == ARGV[1] then " +
              "    redis.call('SETEX', KEYS[1], ARGV[3], ARGV[2]) " +
              "    return 1 " +
              "else " +
              "    return 0 " +
              "end";

  - id: sec-auth-implementation-blacklist
    title: "Implementation: JWT Filter Single-Pass & Blacklist Check"
    role: implementation
    target_templates: ["FEATURE", "TECHNICAL"]
    summary: "JwtAuthenticationFilter에서 중복 파싱을 제거하고 Token Type 및 Blacklist를 순차 검증합니다."
    content_markdown: |
      `validateToken`과 `parseClaims`의 이중 파싱 오버헤드를 단일 `parseClaims` 예외 캐치 구조로 통합하고, Claims 검증 후 Blacklist 조회를 수행합니다.
    code_snippets:
      - source_file: "backend/src/main/java/com/example/demo/auth/security/JwtAuthenticationFilter.java"
        language: "java"
        line_range: "L30-L50"
        code: |
          Claims claims = jwtProvider.parseClaims(token);
          if (!"access".equals(claims.get("type", String.class))) {
              log.warn("Invalid token type attempted: {}", claims.get("type"));
              filterChain.doFilter(request, response);
              return;
          }
          if (tokenBlacklistService.isBlacklisted(claims.getId())) {
              log.warn("Blacklisted token accessed: JTI={}", claims.getId());
              response.sendError(HttpServletResponse.SC_UNAUTHORIZED, "Token is blacklisted");
              return;
          }

  - id: sec-auth-verification
    title: "Verification: 6 Test Suites & k6 Zero-Error Proof"
    role: verification
    target_templates: ["LONGFORM", "FEATURE", "TECHNICAL", "EVIDENCE"]
    summary: "JUnit 5 단위/통합 테스트 6종 및 k6 70 VU 지속 부하 환경에서 0.00% 에러율과 5.64ms 평균 레이턴시를 입증했습니다."
    content_markdown: |
      - **단위/통합 테스트:** RTR 정상 교체, 만료 토큰 거부, 블랙리스트 토큰 401 반환 검증 완료.
      - **부하 테스트 실측:** k6 70 VU 동시 부하 상황에서 인증 필터 오버헤드 1ms 미만, P95 9.98ms 달성.
    claims_covered:
      - claim-auth-jwt-stateless
      - claim-auth-rtr
      - claim-auth-blacklist

  - id: sec-auth-resilience
    title: "Resiliency & Incident: Redis Lettuce 2s Defense"
    role: tradeoff
    target_templates: ["LONGFORM", "TECHNICAL", "EVIDENCE"]
    summary: "Redis 컨테이너 장애 발생 시 기본 60초 블로킹을 2초로 단축하고 503 예외로 격리하여 WAS 장애 전파를 방어했습니다."
    content_markdown: |
      `application.yaml`의 `spring.data.redis.timeout`을 2000ms로 설정하고 `TokenBlacklistService`에서 `DataAccessException` 전체를 `RedisUnavailableException`으로 래핑하여 빠른 실패(Fail-Fast) 정책을 구현했습니다.

  - id: sec-auth-limitations
    title: "Limitations & Roadmap"
    role: limitation
    target_templates: ["LONGFORM", "TECHNICAL"]
    summary: "현재 단일 Redis 구성의 한계를 인지하고 있으며, Redis Cluster 및 분산 환경 세션 동기화 확장을 계획하고 있습니다."
    content_markdown: |
      - 단일 Redis 노드 다운 시 세션 검증이 일시적으로 503 처리되는 한계가 존재합니다.
      - 향후 Redis Sentinel / Cluster 다중화 도입을 통해 99.99% 고가용성을 확보할 계획입니다.

