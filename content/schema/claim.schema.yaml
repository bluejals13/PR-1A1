# Claim Schema
# File: PR-1A1/content/schema/claim.schema.yaml
# Description: Defines the schema for engineering claims and their traceability to evidence

$schema: "http://json-schema.org/draft-07/schema#"
title: "EngineeringClaim"
type: "object"
required:
  - "id"
  - "statement"
  - "type"
  - "evidence_refs"
properties:
  id:
    type: "string"
    pattern: "^claim-[a-z0-9-]+$"
    description: "Unique identifier for the claim"
  statement:
    type: "string"
    description: "Specific engineering statement or assertion"
  type:
    type: "string"
    enum: ["SECURITY", "PERFORMANCE", "ARCHITECTURE", "RESILIENCY", "INTEGRITY"]
  evidence_refs:
    type: "array"
    items:
      type: "string"
      pattern: "^(ev|unev)-[a-z0-9-]+$"
    description: "List of evidence IDs from evidence.yaml backing this claim"
  metrics:
    type: "object"
    description: "Quantitative verified metrics if applicable"
    additionalProperties: true
