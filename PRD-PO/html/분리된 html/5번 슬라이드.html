      <!-- Slide 05: Sequence Diagram -->
    <section class="slide" id="slide-05" data-speaker-note="토큰 라이프사이클의 핵심은 RTR 재발급 시 기존 토큰이 즉시 무효화된다는 점입니다. 공격자가 가로챈 구버전 토큰으로 접근할 경우 서버는 401을 반환하여 재사용을 차단합니다. 로그아웃 또한 잔여 TTL만큼만 블랙리스트를 유지하여 메모리 낭비를 원천 차단합니다.">
      <div class="slide-header">
        <div class="slide-title-wrap">
          <span class="slide-num">SLIDE 05</span>
          <h2 class="slide-title">JWT / RTR / Blacklist 토큰 라이프사이클 흐름</h2>
        </div>
        <span class="tag verified">VERIFIED</span>
      </div>

      <div class="diagram-wrap">

          <rect x="80" y="10" width="110" height="35" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>

          <line x1="425" y1="45" x2="425" y2="330" stroke="#334155" stroke-dasharray="4,4"/>

          <rect x="680" y="10" width="110" height="35" rx="6" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
          <text x="710" y="32" fill="#fff" font-family="sans-serif" font-weight="700" font-size="12">Redis Store</text>
          <line x1="735" y1="45" x2="735" y2="330" stroke="#334155" stroke-dasharray="4,4"/>

          <!-- 1. Login Flow -->
          <text x="150" y="68" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">1. POST /api/auth/login</text>
          <path d="M135 75 L425 75" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-blue)"/>
          <text x="445" y="85" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="11">SET rt:user1 = JTI_1 (TTL 7d)</text>
          <path d="M425 90 L735 90" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow-green)"/>
          <path d="M425 105 L135 105" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrow-blue)"/>
          <text x="175" y="120" fill="#38bdf8" font-size="10">200 OK (Header: AccessToken / Cookie: RefreshToken)</text>

          <!-- 2. RTR Refresh Flow -->
          <text x="150" y="148" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">2. POST /api/auth/refresh (RTR Trigger)</text>
          <path d="M135 155 L425 155" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-blue)"/>
          <text x="445" y="165" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="11">Verify & DEL JTI_1 ➔ SET JTI_2</text>
          <path d="M425 170 L735 170" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
          <path d="M425 185 L135 185" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrow-green)"/>
          <text x="190" y="200" fill="#34d399" font-size="10">200 OK (New Token Pair Issued)</text>

          <!-- 3. Replay Attack Detection -->
          <text x="150" y="228" fill="#f87171" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">3. Replay Attack (Stolen JTI_1 Re-use)</text>
          <path d="M135 235 L425 235" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow-red)"/>
          <text x="445" y="245" fill="#ef4444" font-family="'JetBrains Mono', monospace" font-size="11">GET rt:user1 ➔ Mismatch (JTI_1 != JTI_2)</text>
          <path d="M425 250 L735 250" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrow-red)"/>
          <path d="M425 265 L135 265" stroke="#ef4444" stroke-width="2" stroke-dasharray="3,3" marker-end="url(#arrow-red)"/>
          <text x="185" y="280" fill="#f87171" font-size="10" font-weight="700">401 UNAUTHORIZED (INVALID_REFRESH_TOKEN) [VERIFIED]</text>

          <!-- 4. Logout Blacklist -->
          <text x="150" y="308" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">4. POST /api/auth/logout</text>
          <path d="M135 315 L425 315" stroke="#a855f7" stroke-width="2" marker-end="url(#arrow-purple)"/>
          <text x="445" y="325" fill="#a855f7" font-family="'JetBrains Mono', monospace" font-size="11">SET bl:AccessToken (TTL = Remaining)</text>
          <path d="M425 330 L735 330" stroke="#a855f7" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
