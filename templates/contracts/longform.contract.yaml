# LONGFORM Template Contract
# File: PR-1A1/templates/contracts/longform.contract.yaml
# Schema: PR-1A1/templates/contracts/template.contract.schema.yaml

template_id: "LONGFORM"
template_name: "Comprehensive Engineering Web Portfolio"
purpose: "채용담당자 또는 시니어 엔지니어가 프로젝트 전체 맥락과 문제해결 여정을 깊이 있게 읽을 수 있는 세로형 장문 포트폴리오"
spatial_model: "VERTICAL_CONTINUOUS"
target_audience: "채용담당자, 기술 면접관, 협업 엔지니어"
key_question: "전체적으로 시스템을 어떻게 설계하고, 어떤 문제를 겪었으며, 어떻게 검증했는가?"

required_content_fields:
  - "title"
  - "subtitle"
  - "summary"
  - "sections.problem"
  - "sections.decision"
  - "sections.architecture"
  - "sections.verification"
  - "claims"
  - "sources"

optional_content_fields:
  - "tradeoffs"
  - "limitations"
  - "diagram"
  - "code_snippets"

section_priority_order:
  - "hero"
  - "problem"
  - "decision"
  - "architecture"
  - "implementation"
  - "verification"
  - "tradeoff"
  - "limitation"
  - "source_links"

allowed_layout_nodes:
  - "HERO_BANNER"
  - "TABLE_OF_CONTENTS"
  - "CONTEXT_GRID"
  - "ARCHITECTURE_DIAGRAM"
  - "CODE_DIFF_BLOCK"
  - "METRIC_HIGHLIGHT_GRID"
  - "EXPANDABLE_ACCORDION"
  - "LIMITATION_CARD"

evidence_display_policy: "INLINE_CHIPS"
navigation_policy: "STICKY_TOC"

validation_rules:
  - rule_id: "REQ_PROBLEM_DECISION"
    condition: "has_section('problem') && has_section('decision')"
    error_message: "LONGFORM 템플릿은 반드시 'problem'과 'decision' 섹션을 포함해야 합니다."
  - rule_id: "REQ_VERIFICATION"
    condition: "has_section('verification') || claims.length > 0"
    error_message: "LONGFORM 템플릿은 반드시 검증(verification) 섹션이나 최소 1개 이상의 Claim을 포함해야 합니다."
