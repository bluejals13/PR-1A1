# Change Impact Lookup Table (File Path Pattern -> Affected Domains)
change_impact_mappings:
  - path_pattern: "backend/src/main/java/**/auth/**"
    level: C3
    domains: [DOM-AUTH]
  - path_pattern: "backend/src/main/java/**/iam/**"
    level: C2
    domains: [DOM-RBAC, DOM-DATA]
  - path_pattern: "backend/src/main/resources/db/migration/**"
    level: C4
    domains: [DOM-DATA, DOM-RBAC]
  - path_pattern: "backend/src/main/java/**/common/**"
    level: C2
    domains: [DOM-API]
  - path_pattern: "frontend/src/**"
    level: C2
    domains: [DOM-FE-AUTH]
  - path_pattern: "k6/**"
    level: C1
    domains: [DOM-PERF]
  - path_pattern: "docker-compose.yml"
    level: C4
    domains: [DOM-INFRA, DOM-OBS]
  - path_pattern: "nginx/**"
    level: C4
    domains: [DOM-INFRA]
  - path_pattern: "monitoring/**"
    level: C2
    domains: [DOM-OBS]
