    type: TEST
    domain: DOM-AUTH
    title: "Refresh Token Rotation (RTR) Atomic Lua Script Test"
    claim: "토큰 갱신 시 기존 JTI를 원자적으로 교체하여 동시성 레이스 및 재사용 공격을 차단한다."
    status: VERIFIED
    source:
      repository: 26-05adf
      commit: 9e6ef83d07cf3dc59e8625d78b70f45a5ad2613f
      path: "backend/src/test/java/com/example/demo/auth/security/RefreshTokenRepositoryTest.java"
      test_methods:
        - "rotateSuccess"
        - "rotateFail"
        - "rotateNull"
        - "saveRefreshToken"
        - "deleteRefreshToken"
    target_documents:
      - apms-auth
      - apms-presentation

